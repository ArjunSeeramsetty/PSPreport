apiVersion: v3.0.2
kind: DataContract
id: urn:datacontract:psp:fact-nrldc-frequency-daily
info:
  title: NRLDC Frequency Daily Facts
  version: 1.0.0
  owner: psp-pipeline
schema:
  - name: FactNRLDCFrequencyDaily
    physicalName: FactNRLDCFrequencyDaily
    physicalType: table
    properties:
      - name: ReportDocumentID
        type: integer
        required: true
        primary: true
      - name: DateID
        type: integer
        required: true
        primary: true
      - name: RegionID
        type: integer
        required: true
        primary: true
      - name: MaximumFrequencyHz
        type: number
        required: false
        quality:
          - type: library
            mustBeGreaterThan: 30
            mustBeLessThan: 70
      - name: AverageFrequencyHz
        type: number
        required: false
        quality:
          - type: library
            mustBeGreaterThan: 30
            mustBeLessThan: 70
      - name: IegcBandViolation
        type: integer
        required: false
      - name: FrequencyIntegrity
        type: string
        required: false
