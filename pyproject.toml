[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psp-pipeline"
version = "0.1.0"
description = "Autonomous Indian power-system KG and time-series ingestion pipeline"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: invokes local services or external command-line dependencies",
]
